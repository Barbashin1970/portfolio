# Публикация на GitHub Pages (Р-12, навык vault publish-github-pages).
# Settings → Pages → Source: GitHub Actions. Версии действий сверены 2026-10-26:
# api.github.com/repos/actions/<имя>/releases/latest.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Сборка и предсборка страницы
        run: npm run build
        env:
          # Адрес на Pages повторяет имя репозитория с учётом регистра (Р-18).
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Сторож собранной страницы
        run: npm run check:dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
